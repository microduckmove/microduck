<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e264c">
  <title>Microduck 模擬場｜週末玩 3D</title>
  <link rel="stylesheet" href="./style.css?v=colors">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <main>
    <header>
      <img class="brand-logo" src="./assets/winwin-logo.png" alt="WINWIN 打包勝利">
      <h1>Microduck <span>模擬場</span></h1>
    </header>
    <section class="arena" aria-label="Microduck 3D 操作場">
      <div class="stage" id="stage">
        <div class="badge">週末玩 3D</div>
        <p id="load-status" role="status">正在載入 Microduck…</p>
        <noscript><p class="noscript">開啟 JavaScript 即可操作。</p></noscript>
        <fieldset id="move-pad" aria-label="移動方向" disabled>
          <button type="button" data-move="ArrowUp" aria-label="前進">▲</button>
          <button type="button" data-move="ArrowLeft" aria-label="向左轉">◀</button>
          <button type="button" data-move="ArrowDown" aria-label="後退">▼</button>
          <button type="button" data-move="ArrowRight" aria-label="向右轉">▶</button>
        </fieldset>
      </div>
      <fieldset id="controls" aria-label="動作和視角" disabled>
        <span class="hint"><kbd>WASD</kbd> 或方向鍵移動 · 拖曳轉視角</span>
        <div class="actions">
          <button id="sit" type="button" aria-pressed="false">坐下</button>
          <button id="look" type="button" aria-pressed="false">左右看</button>
          <button id="head-control" type="button" aria-expanded="false" aria-controls="head-panel">頭部控制</button>
          <button id="camera" type="button" aria-pressed="true">跟隨視角</button>
          <button id="reset" type="button">重置</button>
        </div>
        <div class="color-options" role="group" aria-label="部件配色">
          <button type="button" data-color="ff6816" aria-pressed="true">橘色</button>
          <button type="button" data-color="82d8ff" aria-pressed="false">淺藍</button>
          <button type="button" data-color="ffd93d" aria-pressed="false">黃色</button>
        </div>
        <div class="head-panel" id="head-panel" hidden>
          <label for="head-yaw">左右轉 <output id="head-yaw-angle" for="head-yaw">0°</output></label>
          <input id="head-yaw" type="range" min="-170" max="170" value="0">
          <label for="head-pitch">抬低頭 <output id="head-pitch-angle" for="head-pitch">20°</output></label>
          <input id="head-pitch" type="range" min="-90" max="90" value="20">
          <label for="head-roll">左右歪頭 <output id="head-roll-angle" for="head-roll">0°</output></label>
          <input id="head-roll" type="range" min="-25" max="25" value="0">
        </div>
      </fieldset>
    </section>
  </main>
  <script type="module" src="./app.js?v=colors"></script>
</body>
</html>
